# =============================================================================
# 클라우드 가격 원장 (대조 경로)
# 프로젝트: 플래시 대비 계층화 저장 설계 총비용 비교 분석
#
# 단위계 경고
#   본 파일의 항목은 클라우드 서비스 이용료이며 단위는 USD/GB/month 입니다.
#   매체 구매 원가(media_pricing.yaml)와 단위 및 비용 성격이 다릅니다.
#   두 원장의 값을 합산하거나 평균하지 마십시오. (phase00_scope.md 4.2절)
#
#   특히 아래 ssd_price / hdd_price / object_price 는 이름이 매체명과 유사하나
#   매체 구매 원가가 아니라 클라우드 서비스 요금입니다. 주 경로의 매체 단가로
#   전용하지 마십시오. 선행 프로젝트가 제시한 계층 간 64배 격차 역시
#   클라우드 요금제 간의 격차이며 본 프로젝트의 배수 R 과 다른 대상입니다.
#
# status     : confirmed / partial / unverified / assumed / pending
# confidence : official / vendor / thirdparty / derived / assumption / unverified
# =============================================================================

