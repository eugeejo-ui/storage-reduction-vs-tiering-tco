# =============================================================================
# 대조 경로의 배수 — 주 경로의 배수 R 과 별도로 산출한다
# =============================================================================
cloud_ratio:

  block_ssd_to_object:
    base: 3.648          # 0.0912 / 0.025
    unit: "multiple"
    status: confirmed
    confidence: derived
    source_url: "docs/phase02_media_pricing.md#8"
    retrieved: "2026-09-04"
    note: >
      클라우드 요금제 간 배수이다. 주 경로의 매체 단가 배수 R 과 합산하거나
      평균하지 않으며, 두 값이 다르게 나타난다면 그 차이 자체를 결과로 보고한다.
      클라우드 정가는 NAND 계약가 변동을 즉시 반영하지 않는 반면 매체 구매가는
      즉시 반영하므로, 동일 시점에도 두 경로의 배수가 다르게 나타날 수 있다.

  block_ssd_to_block_hdd:
